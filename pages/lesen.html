<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goethe B1 · Lesen · 30 Aufgaben</title><style>
body{font-family:system-ui,sans-serif;background:#f4f1ea;color:#18231e;margin:0}.top{background:#075f45;color:white;padding:22px}.top h1{margin:0}.top p{margin:.4rem 0 0}.wrap{max-width:960px;margin:auto;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}button,select{font:inherit;padding:9px 12px;border:1px solid #9aa79f;border-radius:8px;background:white}button{cursor:pointer}.task{background:white;border-radius:12px;padding:22px;margin:16px 0;box-shadow:0 2px 10px #0001}.badge{color:#075f45;font-weight:700}.text{white-space:pre-line;line-height:1.65;background:#f8faf8;padding:15px;border-left:4px solid #2d8b68}.q{margin:18px 0;padding-top:10px;border-top:1px solid #ddd}.choice{display:block;margin:8px 0}.correct{background:#dff4e6}.wrong{background:#ffe4e1}.answer{font-weight:700;color:#075f45}.ad{padding:10px;margin:8px 0;background:#f8faf8} @media print{.toolbar,button{display:none}.task{break-inside:avoid;box-shadow:none}}
</style></head><body><header class="top"><h1>Goethe B1 · Lesetraining</h1><p>30 Aufgaben in 6 Modellsätzen · 5 Teile pro Satz · Originales Übungsmaterial</p></header><main class="wrap"><div class="toolbar"><select id="set"><option value="all">Alle 30 Aufgaben</option><option value="1">Modellsatz 1</option><option value="2">Modellsatz 2</option><option value="3">Modellsatz 3</option><option value="4">Modellsatz 4</option><option value="5">Modellsatz 5</option><option value="6">Modellsatz 6</option></select><button id="check">Auswerten</button><button id="reset">Zurücksetzen</button><button onclick="print()">Drucken</button></div><div id="root">Lädt …</div></main><script>
let DATA;const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function choices(name,opts){return opts.map((o,i)=>'<label class="choice"><input type="radio" name="'+name+'" value="'+i+'"> '+String.fromCharCode(97+i)+') '+esc(o)+'</label>').join('')}
function renderTask(t){let h='<section class="task" data-set="'+t.id.split('-')[1]+'"><div class="badge">'+esc(t.categoryLabel)+'</div><h2>'+esc(t.title)+'</h2><p><em>'+esc(t.instructions)+'</em></p>';if(t.topic)h+='<p class="text"><b>'+esc(t.topic)+'</b></p>';if(t.text)h+='<div class="text">'+esc(t.text)+'</div>';
if(t.type==='true_false')t.questions.forEach(x=>h+='<div class="q" data-answer="'+(x.answer?0:1)+'"><p>'+esc(x.statement)+'</p>'+choices('q'+x.id,['Richtig','Falsch'])+'</div>');
if(t.type==='multiple_choice')t.questions.forEach(x=>h+='<div class="q" data-answer="'+x.answer+'"><p>'+esc(x.prompt)+'</p>'+choices('q'+x.id,x.options)+'</div>');
if(t.type==='matching_ads'){h+='<h3>Situationen</h3>';t.scenarios.forEach(x=>h+='<div class="q" data-answer="'+t.answer[x.id]+'"><p>'+esc(x.text)+'</p><label>Anzeige: <select name="q'+x.id+'"><option value="">–</option>'+t.ads.map(a=>'<option>'+a.key+'</option>').join('')+'</select></label></div>');h+='<h3>Anzeigen</h3>';t.ads.forEach(a=>h+='<div class="ad"><b>'+a.key+'</b> · '+esc(a.text)+'</div>')}
if(t.type==='opinion_yes_no')t.opinions.forEach(x=>h+='<div class="q" data-answer="'+(x.stance?0:1)+'"><p><b>'+esc(x.name)+':</b> '+esc(x.text)+'</p>'+choices('q'+x.id,['Ja','Nein'])+'</div>');return h+'</section>'}
function render(){let v=document.querySelector('#set').value,parts=DATA.sections[0].parts.filter(t=>v==='all'||t.id.split('-')[1]===v);document.querySelector('#root').innerHTML=parts.map(renderTask).join('')}
fetch('lesen.json').then(r=>r.json()).then(d=>{DATA=d;render()}).catch(()=>document.querySelector('#root').innerHTML='<p>Die JSON-Datei konnte nicht geladen werden. Starten Sie die Datei über einen lokalen Webserver.</p>');document.querySelector('#set').onchange=render;document.querySelector('#check').onclick=()=>document.querySelectorAll('.q').forEach(el=>{let x=el.querySelector('input:checked,select'),ok=x&&String(x.value)===el.dataset.answer;el.classList.remove('correct','wrong');el.classList.add(ok?'correct':'wrong');let old=el.querySelector('.answer');if(old)old.remove();let a=document.createElement('div');a.className='answer';a.textContent='Lösung: '+el.dataset.answer;el.appendChild(a)});document.querySelector('#reset').onclick=()=>{document.querySelectorAll('input').forEach(x=>x.checked=false);document.querySelectorAll('select[name]').forEach(x=>x.value='');document.querySelectorAll('.q').forEach(x=>x.classList.remove('correct','wrong'));document.querySelectorAll('.answer').forEach(x=>x.remove())};
</script></body></html>
